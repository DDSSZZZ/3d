name: Generate and validate 3D model

on:
  push:
    paths:
      - "3d-upload/make_dual_view.py"
      - "3d-upload/validate_output.py"
      - "3d设计/create_qing_hua_blend.py"
      - ".github/workflows/generate-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install geometry dependencies and Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-lxgw-wenkai blender
          python -m pip install --upgrade pip
          python -m pip install numpy pillow scipy scikit-image trimesh

      - name: Generate integrated dual-view sculpture
        run: python 3d-upload/make_dual_view.py

      - name: Validate generated outputs
        run: python 3d-upload/validate_output.py

      - name: Upload STL and projection checks
        uses: actions/upload-artifact@v4
        with:
          name: qing-hua-model-output
          path: |
            3d-upload/qing_hua_integrated.stl
            3d-upload/projection_qing.png
            3d-upload/projection_hua.png
            3d-upload/projection_check.json
          if-no-files-found: error
          retention-days: 30

      - name: Package mesh as editable Blender project
        working-directory: 3d设计
        run: blender --background --python create_qing_hua_blend.py

      - name: Upload Blender project
        uses: actions/upload-artifact@v4
        with:
          name: qing-hua-blender-project
          path: |
            3d设计/qing_hua_boolean_editable.blend
            3d设计/qing_hua_boolean.stl
          if-no-files-found: error
          retention-days: 30
